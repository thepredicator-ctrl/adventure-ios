name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy.yml'

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          IOS_BUILD: 'true'

      - name: Capacitor sync
        run: npx cap sync ios

      - name: List schemes
        run: xcodebuild -project ios/App/App.xcodeproj -list

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            SWIFT_COMPILATION_MODE=wholemodule

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -r Adventure.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-iOS-IPA
          path: Adventure.ipa
          if-no-files-found: error
          retention-days: 7
