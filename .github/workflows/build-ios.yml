name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Node
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor iOS
        run: npm install @capacitor/ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Check iOS project
        run: |
          echo "Contents of ios/App:"
          ls -la ios/App
          echo ""
          echo "Xcode projects:"
          find ios -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/App/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
            ios/App/build/Build/Products/Release-iphoneos/App.app \
            Payload/App.app

          zip -r Adventure.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Adventure-iOS-IPA
          path: Adventure.ipa
          if-no-files-found: error
